name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: temurin
          cache: maven

      - name: Build and test
        run: mvn verify --batch-mode --no-transfer-progress

      - name: Smoke test
        run: |
          JAR=$(ls target/jws-diag-*.jar | head -n1)
          echo "Testing $JAR"
          java -jar "$JAR" --help

      - name: Stage release files with checksum
        run: |
          JAR=$(ls target/jws-diag-*.jar | head -n1)
          mkdir -p dist
          cp "$JAR" "dist/jws-diag-${GITHUB_REF_NAME}.jar"
          cd dist
          sha256sum "jws-diag-${GITHUB_REF_NAME}.jar" > "jws-diag-${GITHUB_REF_NAME}.jar.sha256"

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          body_path: RELEASE_NOTES.md
          files: |
            dist/*.jar
            dist/*.sha256
